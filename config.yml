<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идеи для ивентов</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #0f0f13;
            --card-bg: rgba(30, 30, 40, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #00ffcc;
            --accent-hover: #00ccaa;
            --danger: #ff4d4d;
            --warn: #ffb020;
            --success: #00d26a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(176, 0, 255, 0.08), transparent 25%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 15, 19, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { font-size: 24px; font-weight: 800; color: #fff; }
        .admin-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .admin-btn:hover { color: #fff; transform: rotate(90deg); }

        #admin-panel { display: none; background: #1a1a24; padding: 15px 40px; border-bottom: 1px solid var(--accent); }
        #admin-panel.active { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .btn-danger { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-accent { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .form-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
            padding: 25px; backdrop-filter: blur(12px); height: fit-content; position: sticky; top: 100px;
        }
        .form-panel h2 { font-size: 18px; margin-bottom: 20px; color: #fff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .submit-btn {
            width: 100%; background: var(--accent); color: #000; border: none; padding: 14px;
            border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .submit-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .search-input { background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 20px; outline: none; font-family: 'Inter', sans-serif; width: 250px; }
        .search-input:focus { border-color: var(--accent); }
        
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted);
            padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .filter-btn:hover { border-color: #fff; color: #fff; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

        .ideas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .idea-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; backdrop-filter: blur(12px); display: flex; flex-direction: column;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .idea-card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .idea-card.pinned { border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 255, 204, 0.15); }
        .idea-card.pinned::before {
            content: "📌 Выбор стримера"; position: absolute; top: 0; right: 0;
            background: var(--accent); color: #000; font-size: 10px; font-weight: 800;
            padding: 4px 10px; border-bottom-left-radius: 8px;
        }
        .idea-card.status-in_progress { border-left: 4px solid var(--warn); }
        .idea-card.status-implemented { border-left: 4px solid var(--success); opacity: 0.7; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        .card-title { font-size: 18px; font-weight: 600; color: #fff; line-height: 1.3; }
        .badges { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
        .badge.danger { background: rgba(255, 77, 77, 0.15); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.3); }
        .badge.fun { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); }
        .badge.helpful { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.3); }
        .badge.chaos { background: rgba(176, 0, 255, 0.15); color: #b000ff; border: 1px solid rgba(176, 0, 255, 0.3); }
        .badge.donate { background: rgba(0, 191, 255, 0.15); color: #00bfff; border: 1px solid rgba(0, 191, 255, 0.3); }
        
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #333; color: #ccc; }
        .status-in_progress .status-badge { background: rgba(255, 176, 32, 0.2); color: var(--warn); }
        .status-implemented .status-badge { background: rgba(0, 210, 106, 0.2); color: var(--success); }

        .card-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; flex-grow: 1; }
        
        .card-meta { display: flex; gap: 10px; font-size: 12px; margin-bottom: 15px; }
        .cost-tag { background: rgba(255, 215, 0, 0.1); color: #ffd700; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 15px; }
        .author { font-size: 12px; color: var(--text-muted); }
        .author span { color: var(--accent); font-weight: 600; }
        
        .actions { display: flex; gap: 8px; }
        .action-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
            font-size: 13px; font-weight: 600; transition: 0.2s; padding: 6px 10px; border-radius: 6px;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .action-btn.upvote:hover { border-color: var(--success); color: var(--success); }
        .action-btn.upvote.active { background: rgba(0, 210, 106, 0.1); border-color: var(--success); color: var(--success); }
        
        .admin-controls { display: none; gap: 5px; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
        .admin-controls.active { display: flex; flex-wrap: wrap; }
        .admin-controls button { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .admin-controls button:hover { background: rgba(255,255,255,0.2); }
        .admin-controls button.del:hover { background: var(--danger); }
        .admin-controls button.status-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--accent); color: #000; padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px; transition: 0.3s; opacity: 0; z-index: 1000; box-shadow: 0 5px 20px rgba(0, 255, 204, 0.4);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-bg.show { display: flex; }
        .modal { background: #1a1a24; border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 650px; padding: 20px; }
        .modal h3 { margin-bottom: 15px; color: #fff; }
        .modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .modal textarea { width: 100%; height: 350px; background: #0f0f13; color: var(--accent); border: 1px solid var(--border); border-radius: 8px; padding: 15px; font-family: monospace; font-size: 13px; resize: none; outline: none; margin-bottom: 15px; }
        .modal input { width: 100%; background: #0f0f13; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; outline: none; margin-bottom: 15px; font-family: 'Inter', sans-serif; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; }
        .modal-actions button.close { background: transparent; color: var(--text-muted); }
        .modal-actions button.copy { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <header>
        <h1>💡 Идеи для ивентов</h1>
        <button class="admin-btn" id="admin-toggle" title="Режим стримера">⚙️</button>
    </header>

    <div id="admin-panel">
        <span style="color:#fff; font-weight:600; font-size:14px;">Режим стримера</span>
        <button class="btn-accent" id="webhook-btn">⚙️ Webhook</button>
        <button class="btn-danger" id="clear-all-btn">🗑 Очистить всё</button>
        <button class="btn-danger" style="background:transparent; color:#94a3b8; border-color:#94a3b8;" onclick="toggleAdmin()">Выйти</button>
    </div>

    <div class="container">
        <!-- Форма -->
        <div class="form-panel">
            <h2>💡 Предложить идею</h2>
            <form id="idea-form">
                <div class="form-group">
                    <label>Ваш ник</label>
                    <input type="text" id="author" placeholder="Twitch / YouTube" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>Название ивента</label>
                    <input type="text" id="title" placeholder="Кратко и понятно" maxlength="40" required>
                </div>
                <div class="form-group">
                    <label>Описание (что должно произойти?)</label>
                    <textarea id="desc" placeholder="Опиши механику ивента..." maxlength="300" required></textarea>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Категория</label>
                        <select id="category">
                            <option value="danger">⚔️ Опасно</option>
                            <option value="fun">🎉 Весело</option>
                            <option value="helpful">💚 Полезно</option>
                            <option value="chaos">🌀 Хаос</option>
                            <option value="donate">💰 Донат</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Стоимость (очки)</label>
                        <input type="number" id="cost" value="50" min="0" max="9999" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Отправить идею</button>
            </form>
        </div>

        <!-- Сетка идей -->
        <div>
            <div class="toolbar">
                <div class="filters" id="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="danger">Опасно</button>
                    <button class="filter-btn" data-filter="fun">Весело</button>
                    <button class="filter-btn" data-filter="helpful">Полезно</button>
                    <button class="filter-btn" data-filter="chaos">Хаос</button>
                    <button class="filter-btn" data-filter="donate">Донат</button>
                </div>
                <input type="text" class="search-input" id="search" placeholder="Поиск по названию или автору...">
            </div>

            <div class="ideas-grid" id="ideas-grid"></div>
        </div>
    </div>

    <!-- Модалка YAML -->
    <div class="modal-bg" id="yaml-modal">
        <div class="modal">
            <h3>📋 Код для events.yml</h3>
            <p>Скопируйте этот код и вставьте в плагин. <b>Внимание:</b> в блоке <code>effects</code> находится заготовка, допишите нужные параметры.</p>
            <textarea id="yaml-code" readonly></textarea>
            <div class="modal-actions">
                <button class="close" onclick="document.getElementById('yaml-modal').classList.remove('show')">Закрыть</button>
                <button class="copy" onclick="copyYaml()">Скопировать</button>
            </div>
        </div>
    </div>

    <!-- Модалка Webhook -->
    <div class="modal-bg" id="webhook-modal">
        <div class="modal">
            <h3>🔗 Discord Webhook</h3>
            <p>Вставьте URL вебхука из настроек канала Discord. Все новые идеи будут прилетать туда.</p>
            <input type="text" id="webhook-url" placeholder="https://discord.com/api/webhooks/...">
            <div class="modal-actions">
                <button class="close" onclick="document.getElementById('webhook-modal').classList.remove('show')">Отмена</button>
                <button class="copy" onclick="saveWebhook()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let ideas = JSON.parse(localStorage.getItem('streamchaos_ideas_v3')) || [];
        let currentFilter = 'all';
        let currentSort = 'new';
        let isAdmin = false;
        let userVotes = JSON.parse(localStorage.getItem('streamchaos_votes_v3')) || {};
        let searchQuery = '';
        let webhookUrl = localStorage.getItem('streamchaos_webhook') || '';

        const grid = document.getElementById('ideas-grid');
        const form = document.getElementById('idea-form');
        const filters = document.getElementById('filters');
        const toast = document.getElementById('toast');
        const adminPanel = document.getElementById('admin-panel');
        const yamlModal = document.getElementById('yaml-modal');
        const yamlCode = document.getElementById('yaml-code');
        const searchInput = document.getElementById('search');
        const webhookModal = document.getElementById('webhook-modal');

        function saveData() { localStorage.setItem('streamchaos_ideas_v3', JSON.stringify(ideas)); }
        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
        function escapeHtml(text) { const div = document.createElement('div'); div.innerText = text; return div.innerHTML; }
        function timeAgo(ts) {
            const diff = Date.now() - ts; const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'только что'; if (mins < 60) return mins + ' мин. назад';
            const hours = Math.floor(mins / 60); if (hours < 24) return hours + ' ч. назад';
            return Math.floor(hours / 24) + ' дн. назад';
        }

        function render() {
            let filtered = ideas.filter(i => {
                const matchCat = currentFilter === 'all' || i.category === currentFilter;
                const matchSearch = i.title.toLowerCase().includes(searchQuery) || i.author.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });
            
            if (currentSort === 'new') filtered.sort((a, b) => b.timestamp - a.timestamp);
            else if (currentSort === 'top') filtered.sort((a, b) => b.upvotes - a.upvotes);
            filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div>👻</div>Ничего не найдено</div>`;
                return;
            }

            filtered.forEach(idea => {
                const isVoted = userVotes[idea.id];
                const card = document.createElement('div');
                card.className = `idea-card ${idea.pinned ? 'pinned' : ''} status-${idea.status || 'new'}`;
                
                let adminHtml = '';
                if (isAdmin) {
                    adminHtml = `
                        <div class="admin-controls active">
                            <button onclick="togglePin('${idea.id}')">${idea.pinned ? 'Открепить' : 'Закрепить'}</button>
                            <button class="status-btn ${idea.status==='new'?'active':''}" onclick="setStatus('${idea.id}','new')">Новая</button>
                            <button class="status-btn ${idea.status==='in_progress'?'active':''}" onclick="setStatus('${idea.id}','in_progress')">В работе</button>
                            <button class="status-btn ${idea.status==='implemented'?'active':''}" onclick="setStatus('${idea.id}','implemented')">Готово</button>
                            <button class="del" onclick="deleteIdea('${idea.id}')">Удалить</button>
                        </div>
                    `;
                }

                let statusText = idea.status === 'in_progress' ? 'В работе' : idea.status === 'implemented' ? 'Реализовано' : 'Новая';
                let statusBadge = idea.status !== 'new' ? `<span class="status-badge">${statusText}</span>` : '';
                
                // Кнопка YAML только для админа
                let yamlBtn = isAdmin ? `<button class="action-btn" onclick="openYaml('${idea.id}')" title="Скопировать YAML">🔗</button>` : '';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${escapeHtml(idea.title)}</div>
                        <div class="badges">
                            <span class="badge ${idea.category}">${getCatName(idea.category)}</span>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="card-desc">${escapeHtml(idea.desc)}</div>
                    <div class="card-meta">
                        <span class="cost-tag">💰 ${idea.cost} очков</span>
                    </div>
                    <div class="card-footer">
                        <div class="author">от <span>${escapeHtml(idea.author)}</span> • ${timeAgo(idea.timestamp)}</div>
                        <div class="actions">
                            ${yamlBtn}
                            <button class="action-btn upvote ${isVoted ? 'active' : ''}" onclick="upvote('${idea.id}')">👍 ${idea.upvotes}</button>
                        </div>
                    </div>
                    ${adminHtml}
                `;
                grid.appendChild(card);
            });
        }

        function getCatName(c) { const m = { danger: 'Опасно', fun: 'Весело', helpful: 'Полезно', chaos: 'Хаос', donate: 'Донат' }; return m[c] || c; }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newIdea = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                author: document.getElementById('author').value.trim(),
                title: document.getElementById('title').value.trim(),
                desc: document.getElementById('desc').value.trim(),
                category: document.getElementById('category').value,
                cost: parseInt(document.getElementById('cost').value) || 50,
                upvotes: 0, timestamp: Date.now(), pinned: false, status: 'new'
            };
            ideas.push(newIdea); saveData(); form.reset();
            document.getElementById('cost').value = 50;
            
            // Отправка в Discord, если настроен Webhook
            if (webhookUrl) {
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `💡 **Новая идея от ${newIdea.author}**\n**Название:** ${newIdea.title}\n**Категория:** ${getCatName(newIdea.category)} | **Цена:** ${newIdea.cost}\n**Описание:** ${newIdea.desc}`
                    })
                }).catch(err => console.error('Webhook error:', err));
            }

            showToast('Идея успешно отправлена!'); render();
        });

        function upvote(id) {
            if (userVotes[id]) { showToast('Вы уже голосовали!'); return; }
            const idea = ideas.find(i => i.id === id);
            if (idea) { idea.upvotes++; userVotes[id] = true; localStorage.setItem('streamchaos_votes_v3', JSON.stringify(userVotes)); saveData(); render(); }
        }

        filters.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active'); currentFilter = e.target.dataset.filter; render();
            }
        });
        
        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); render(); });

        document.getElementById('admin-toggle').addEventListener('click', () => {
            if (isAdmin) toggleAdmin();
            else {
                const pass = prompt('Пароль стримера:');
                if (pass === 'admin') { isAdmin = true; adminPanel.classList.add('active'); showToast('Админка включена'); render(); }
                else if (pass !== null) alert('Неверный пароль!');
            }
        });

        function toggleAdmin() { isAdmin = false; adminPanel.classList.remove('active'); render(); }
        function deleteIdea(id) { if (confirm('Удалить?')) { ideas = ideas.filter(i => i.id !== id); saveData(); render(); } }
        function togglePin(id) { const i = ideas.find(x => x.id === id); if (i) { i.pinned = !i.pinned; saveData(); render(); } }
        function setStatus(id, status) { const i = ideas.find(x => x.id === id); if (i) { i.status = status; saveData(); render(); } }
        document.getElementById('clear-all-btn').addEventListener('click', () => { if (confirm('ВСЁ УДАЛИТЬ?')) { ideas = []; saveData(); render(); } });

        // Webhook настройки
        document.getElementById('webhook-btn').addEventListener('click', () => {
            document.getElementById('webhook-url').value = webhookUrl;
            webhookModal.classList.add('show');
        });

        function saveWebhook() {
            webhookUrl = document.getElementById('webhook-url').value.trim();
            localStorage.setItem('streamchaos_webhook', webhookUrl);
            webhookModal.classList.remove('show');
            showToast(webhookUrl ? 'Webhook сохранен!' : 'Webhook отключен');
        }

        function openYaml(id) {
            const i = ideas.find(x => x.id === id);
            if (!i) return;

            let safeId = i.title.toLowerCase().replace(/[^a-z0-9_]/g, '_');
            if (!safeId || safeId === '_') safeId = 'custom_event_' + i.id;

            let effects = `    - type: "broadcast_msg"\n      text: "§8[§c!§8] §7Ивент от ${i.author}: §e${i.title}"\n`;
            
            if (i.category === 'danger') effects += `    - type: "spawn_aggressive_mob"\n      mob: "ZOMBIE"\n      amount: 1\n      radius: 5\n`;
            else if (i.category === 'helpful') effects += `    - type: "apply_potion_radius"\n      effect: "REGENERATION"\n      duration: 200\n      amplifier: 1\n`;
            else if (i.category === 'chaos') effects += `    - type: "absolute_chaos"\n`;
            else if (i.category === 'donate') effects += `    - type: "give_custom_item"\n      item: "DIAMOND"\n      amount: 16\n`;
            else effects += `    - type: "spawn_fireworks_all"\n`;

            effects += `    # ДОБАВЬТЕ СВОИ ЭФФЕКТЫ ЗДЕСЬ\n`;

            const yaml = `  ${safeId}:\n    name: "${i.title}"\n    description: "${i.desc}"\n    category: "${i.category}"\n    titleColor: "YELLOW"\n    cost: ${i.cost}\n    enabled: true\n    server-safe: false\n    effects:\n${effects}`;

            yamlCode.value = yaml;
            yamlModal.classList.add('show');
        }

        function copyYaml() { yamlCode.select(); document.execCommand('copy'); showToast('Код скопирован!'); yamlModal.classList.remove('show'); }

        render();
    </script>
</body>
</html>
